services:
  db:
    # Aligne sur Neon (18.x) : la migration 0000 et les tests doivent
    # rencontrer le meme moteur en local, en CI et en production.
    image: postgres:18-alpine
    container_name: centre-affaires-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: centre_affaires
      # Base en UTC : le fuseau est appliqué à l'affichage (décision 4).
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      # L'image 18 range les données sous /var/lib/postgresql/18/docker et
      # attend le volume sur /var/lib/postgresql. Elle refuse de démarrer si un
      # volume est encore monté sur l'ancien emplacement, /var/lib/postgresql/data.
      #
      # D'où un volume neuf : l'ancien, `db-data` (en pratique
      # `centre-affaires_db-data`), n'est plus lu. Il ne contenait qu'une base de
      # travail jetable (ADR 003). Pour en garder le contenu, le sauvegarder
      # avec l'image qui l'a écrit avant de le supprimer :
      # `docker volume rm centre-affaires_db-data`. Voir README.md.
      - db-data-18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d centre_affaires"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data-18:
