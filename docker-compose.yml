services:
  db:
    # Aligne sur Neon (18.x) : la migration 0000 et les tests doivent
    # rencontrer le meme moteur en local, en CI et en production.
    image: postgres:18-alpine
    container_name: centre-affaires-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: centre_affaires
      # Base en UTC : le fuseau est appliqué à l'affichage (décision 4).
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d centre_affaires"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
