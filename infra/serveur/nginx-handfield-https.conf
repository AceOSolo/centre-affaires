# nginx devant l'application (ADR 042), port 443. À copier dans
# /etc/nginx/sites-available/, et à n'activer qu'une fois le certificat
# obtenu : nginx refuse de démarrer si un certificat cité manque, ce qui
# bloquerait le rechargement de tous les sites du serveur.
# Procédure complète : infra/serveur/README.md.
# Si PORT_LOCAL est défini dans le `.env` de l'application, remplacer 3000.

# Une seule adresse canonique : le domaine nu renvoie vers www, chemin
# compris. Pas l'inverse ailleurs, sinon boucle.
server {
    listen 443 ssl;
    server_name handfield.fr;

    ssl_certificate     /etc/letsencrypt/live/www.handfield.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.handfield.fr/privkey.pem;

    return 301 https://www.handfield.fr$request_uri;
}

server {
    listen 443 ssl;
    server_name www.handfield.fr;

    ssl_certificate     /etc/letsencrypt/live/www.handfield.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.handfield.fr/privkey.pem;

    # Numérisations de courrier : jusqu'à deux fichiers de 10 Mo par envoi
    # (ADR 015). 22 Mo laissent la place à l'habillage multipart ; au-delà,
    # nginx refuse (413) avant même d'appeler l'application.
    client_max_body_size 22m;

    location / {
        proxy_pass http://127.0.0.1:3000;

        # L'application construit ses redirections (connexion, retour après
        # formulaire) à partir de l'hôte et du protocole reçus. Sans ces
        # en-têtes, elle se croirait en http://127.0.0.1:3000.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    access_log /var/log/nginx/handfield-access.log;
    error_log  /var/log/nginx/handfield-error.log;
}
