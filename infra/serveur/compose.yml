# Production sur le VPS de production (ADR 013).
#
# Ce fichier est recopié sur le serveur à chaque déploiement par la CI : la
# configuration suit le dépôt. Les secrets, eux, vivent dans le `.env` posé à
# côté, jamais dans le dépôt (modèle : `.env.example`). HTTPS et le domaine
# sont l'affaire du nginx déjà en place (`nginx-handfield-*.conf`).
name: centre-affaires

services:
  app:
    # La CI fixe IMAGE_TAG au commit déployé. Sans lui, la dernière image de main.
    image: ghcr.io/aceosolo/centre-affaires:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    # Publié sur la boucle locale seulement : joignable par nginx, jamais
    # depuis l'extérieur. PORT_LOCAL si 3000 est déjà pris sur le serveur.
    ports:
      - "127.0.0.1:${PORT_LOCAL:-3000}:3000"
    # Journaux bornés (registre RGPD, docs/rgpd/durees-de-conservation.md) :
    # sans limite, Docker les garde jusqu'à saturer le disque. Ils peuvent
    # citer une adresse électronique dans une erreur d'envoi. Cinq fichiers
    # de 10 Mo au plus, effacés aussi à chaque déploiement, qui recrée le
    # conteneur.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      # Un fichier statique plutôt qu'une page : vérifie le serveur Node sans
      # réveiller la base Neon toutes les 30 secondes.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/favicon.ico"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
