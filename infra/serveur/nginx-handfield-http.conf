# nginx devant l'application (ADR 042), port 80. À copier dans
# /etc/nginx/sites-available/ puis à activer par un lien dans sites-enabled.
# Procédure complète, certificat compris : infra/serveur/README.md.
#
# S'installe avant `nginx-handfield-https.conf` : c'est lui qui sert la
# validation Let's Encrypt, et le bloc HTTPS ne peut pas être activé tant que
# le certificat n'existe pas.

# Tout part vers l'adresse canonique en HTTPS — Neon Auth pose des cookies
# `Secure`, la connexion ne marche qu'en HTTPS — sauf la validation
# Let's Encrypt, servie depuis le dossier de certbot (`--webroot`).
# Pas d'écoute IPv6 : le DNS ne publie pas d'AAAA (README, section 6).
server {
    listen 80;
    server_name www.handfield.fr handfield.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://www.handfield.fr$request_uri;
    }
}
