# Apache devant l'application (ADR 013), à copier dans
# /etc/apache2/sites-available/ puis `a2ensite apache-handfield`.
#
# Modules requis : `a2enmod proxy proxy_http headers ssl rewrite`.
# Procédure complète, certificat compris : infra/serveur/README.md.
# Si PORT_LOCAL est défini dans le `.env` de l'application, remplacer 3000.

# HTTP : tout part vers l'adresse canonique en HTTPS — Neon Auth pose des
# cookies `Secure`, la connexion ne marche qu'en HTTPS — sauf la validation
# Let's Encrypt, servie depuis le dossier de certbot (`--webroot`).
<VirtualHost *:80>
    ServerName www.handfield.fr
    ServerAlias handfield.fr

    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
    <Directory /var/www/letsencrypt>
        Require all granted
    </Directory>
    RedirectMatch permanent ^/(?!\.well-known/acme-challenge/)(.*)$ https://www.handfield.fr/$1
</VirtualHost>

# Actif seulement une fois le certificat obtenu : le fichier peut être activé
# avant, sans qu'Apache refuse de démarrer faute de certificat.
<IfFile /etc/letsencrypt/live/www.handfield.fr/fullchain.pem>
<VirtualHost *:443>
    ServerName www.handfield.fr
    ServerAlias handfield.fr

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/www.handfield.fr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/www.handfield.fr/privkey.pem

    # Une seule adresse canonique : le domaine nu renvoie vers www, chemin
    # compris. Pas l'inverse ailleurs, sinon boucle.
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^handfield\.fr$ [NC]
    RewriteRule ^ https://www.handfield.fr%{REQUEST_URI} [R=301,L]

    # L'application construit ses redirections (connexion, retour après
    # formulaire) à partir de l'hôte et du protocole reçus. Sans ces deux
    # lignes, elle se croirait en http://127.0.0.1:3000.
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # Numérisations de courrier : jusqu'à deux fichiers de 10 Mo par envoi
    # (ADR 015). 22 Mo laissent la place à l'habillage multipart ; au-delà,
    # Apache refuse avant même d'appeler l'application.
    LimitRequestBody 23068672

    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog  ${APACHE_LOG_DIR}/handfield-error.log
    CustomLog ${APACHE_LOG_DIR}/handfield-access.log combined
</VirtualHost>
</IfFile>
