name: ci
on:
  push:
  pull_request:
  # Relancer la CI à la main (onglet Actions). Elle ne déploie plus : le job
  # `deploy` a été retiré le 15/10/2026 (e469801) et la mise en ligne se fait
  # à la main (infra/serveur/README.md, section 4). Le rétablir est une
  # décision en attente.
  workflow_dispatch:
jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      # Les règles de la base (anti-double-réservation, gardes d'écriture,
      # numérotation) ne sont vérifiables que par un vrai moteur :
      # src/modules/**/**.db.test.ts applique la structure et les règles puis
      # les met à l'épreuve. Même version et mêmes options que le serveur de
      # production (infra/serveur/compose.yml).
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: centre_affaires_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Mot de passe en clair assumé : le conteneur est jetable et n'est
      # joignable que depuis ce job.
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: centre_affaires_test
      DB_USER: centre_affaires
      DB_PASSWORD: ci
      DB_ADMIN_USER: root
      DB_ADMIN_PASSWORD: ci
      # Base jetable des tests d'intégration (src/db/test-support.ts).
      TEST_DB_NAME: centre_affaires_test
      TEST_DB_ADMIN_USER: root
      TEST_DB_ADMIN_PASSWORD: ci
      TEST_DB_USER: centre_affaires
      TEST_DB_PASSWORD: ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm run lint
      # Règle de rétention et refus du script de sauvegarde du serveur (ADR 022).
      - run: bash infra/serveur/sauvegarde.test.sh
      # Un service GitHub ne prend pas d'options de démarrage de MySQL : le
      # réglage que compose.yml passe en ligne de commande est posé ici. Sans
      # lui, le journal binaire refuse les fonctions des règles métier.
      - run: docker exec ${{ job.services.mysql.id }} mysql -uroot -pci -e "SET GLOBAL log_bin_trust_function_creators = 1"
      # Structure, règles métier, utilisateur applicatif (DB_USER) et ses droits
      # (ADR 042) : ce que fait le serveur de production à chaque mise à jour.
      - run: npm run db:migrer
      - run: npm test
