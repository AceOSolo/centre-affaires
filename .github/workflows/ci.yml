name: ci
on:
  push:
  pull_request:
  # Relancer un déploiement à la main (onglet Actions), sur main uniquement.
  workflow_dispatch:
jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      # Les contraintes de la base (exclusion anti-double-réservation, RLS) ne
      # sont vérifiables que par un vrai moteur : src/modules/**/**.db.test.ts
      # applique les migrations puis les met à l'épreuve.
      # Version alignée sur Neon (18.x) : la 0000 s'appuie sur des comportements
      # de Postgres 18, tester sur une version antérieure ne prouverait rien.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: centre_affaires_test
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Propriétaire : migrations, TRUNCATE, création d'un second centre.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/centre_affaires_test
      TEST_OWNER_DATABASE_URL: postgres://postgres:postgres@localhost:5432/centre_affaires_test
      # Rôle applicatif : sans BYPASSRLS, donc soumis aux politiques. C'est sa
      # vue que les tests contrôlent. `postgres` est superutilisateur et
      # contournerait la RLS : le test « RLS fermée par défaut » passerait à côté.
      # Mot de passe en clair assumé : le conteneur est jetable et n'est
      # joignable que depuis ce job.
      APP_DB_PASSWORD: ci
      TEST_DATABASE_URL: postgres://app_centre:ci@localhost:5432/centre_affaires_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm run lint
      # Règle de rétention et refus du script de sauvegarde du serveur (ADR 022).
      - run: bash infra/serveur/sauvegarde.test.sh
      # Les migrations passent par le propriétaire, puis le rôle applicatif
      # reçoit son mot de passe : il est créé sans, par la migration 0004.
      - run: npx drizzle-kit migrate
      - run: node infra/provision-role-applicatif.mjs
      - run: npm test --if-present

  # Déploiement sur le VPS de production (ADR 013), après une CI verte sur main.
  # Inactif tant que la variable de dépôt VPS_HOST n'existe pas : main ne doit
  # pas passer au rouge avant que le serveur soit prêt (infra/serveur/README.md).
  deploy:
    needs: ci
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.VPS_HOST != ''
    runs-on: ubuntu-latest
    environment: production
    # Deux pushes rapprochés : les déploiements s'enchaînent, jamais en parallèle.
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4
      # GHCR n'accepte que des noms en minuscules ; le dépôt s'appelle AceOSolo/…
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          # Rattache l'image au dépôt sur GHCR : c'est ce qui donne au jeton du
          # job le droit de la republier et de la tirer au déploiement suivant.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Accès SSH au serveur
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          # Empreinte du serveur relevée une fois à l'installation : on refuse
          # de parler à une machine qui ne la présente pas.
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host serveur\n  HostName %s\n  Port %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  StrictHostKeyChecking yes\n' \
            "$VPS_HOST" "$VPS_PORT" "$VPS_USER" > ~/.ssh/config
      # La configuration suit le dépôt ; le `.env`, lui, n'y est jamais. Le
      # fichiers nginx sont déposés à côté mais s'installent à la main, en root
      # (infra/serveur/README.md) : le compte de déploiement n'y touche pas.
      # Le script de sauvegarde suit le dépôt de la même façon ; sa
      # configuration (`sauvegarde.env`) reste sur le serveur (ADR 022).
      - run: scp infra/serveur/compose.yml infra/serveur/nginx-handfield-*.conf infra/serveur/sauvegarde.sh serveur:centre-affaires/
      - name: Mise en service
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        # Le jeton de la CI sert à tirer l'image puis expire avec le job : aucun
        # identifiant durable ne reste sur le serveur. `--wait` échoue si
        # l'application ne devient pas saine, et le job avec. Les images des
        # déploiements précédents sont supprimées : un retour arrière passe par
        # un `git revert` sur main, qui redéploie.
        run: |
          ssh serveur "docker login ghcr.io -u '$GHCR_USER' --password-stdin" <<< "$GHCR_TOKEN"
          ssh serveur "cd centre-affaires \
            && IMAGE_TAG=$IMAGE_TAG docker compose pull app \
            && IMAGE_TAG=$IMAGE_TAG docker compose up -d --wait \
            ; status=\$?; docker logout ghcr.io; docker image prune -af; exit \$status"
